<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Panel administratora</title><link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;color:#1d2733}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;color:#1d2733;border-bottom:4px solid;border-image:linear-gradient(90deg,#0b6fc2,#e32b2b,#f2b705,#2e8b3d) 1}.lg{height:50px;width:auto;display:block}@media(max-width:800px){.lg{height:40px}}h1{font-size:17px;margin:0;flex:1}
button{font:inherit;padding:6px 12px;border:1px solid #b9c3cf;border-radius:6px;background:#fff;cursor:pointer}button.p{background:#2e9e4f;color:#fff;border-color:#2e9e4f}
#login{margin:20vh auto;display:flex;flex-direction:column;gap:8px;width:min(300px,90vw)}
#app{display:none;flex:1;grid-template-columns:1fr 360px;min-height:0}#app.on{display:grid}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:40% 60%}}
#map{min-height:0}aside{overflow:auto;padding:10px;border-left:1px solid #d5dbe2}
input,select{width:100%;padding:6px;border:1px solid #b9c3cf;border-radius:6px;font:inherit}label{display:block;margin:6px 0;font-size:13px}
.r{display:flex;gap:8px}ul{list-style:none;margin:0 0 10px;padding:0;max-height:170px;overflow:auto;border:1px solid #d5dbe2;border-radius:6px}
li{padding:5px 8px;border-bottom:1px solid #e7ebf0;cursor:pointer;font-size:13px}li.h{background:#eef4fb;font-weight:600}li small{color:#b26a00}li small.ok{color:#2e9e4f}
.m{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #000a;margin:2px}.m.on{width:24px;height:24px;margin:-1px;border-color:#1f3a5f}
#msg{font-size:13px}.e{color:#d33}
</style></head><body>
<header><img class="lg" src="logo.jpg" alt="Skórzewo 360"><h1>Panel administratora</h1><span id="msg"></span><button id="add">Nowa inwestycja</button><button id="save" class="p">Zapisz zmiany</button></header>
<div id="login"><b>Hasło administratora</b><input id="pw" type="password"><button id="go" class="p">Zaloguj</button><span id="err" class="e"></span></div>
<div id="app"><div id="map"></div><aside><ul id="ls"></ul><div id="f" hidden>
<label>Nazwa<input id="name"></label>
<label>Typ<select id="type"><option value="budowa">Budowa</option><option value="projekt">Projekt</option></select></label>
<label>Etap<select id="stage"></select></label>
<div class="r"><label>Szerokość<input id="lat" type="number" step="any"></label><label>Długość<input id="lng" type="number" step="any"></label></div>
<label>Status lokalizacji<select id="coordStatus"><option>przybliżona</option><option>zatwierdzona</option></select></label>
<label>Koszt zadania (zł)<input id="cost" type="number" min="0"></label>
<label>Data podpisania umowy<input id="signed" type="date"></label>
<div class="r"><label>Czas trwania umowy<input id="dur" type="number" min="0"></label><label>Jednostka<select id="unit"><option>dni</option><option>miesięcy</option></select></label></div>
<button id="del">Usuń inwestycję</button></div><p><small>Przeciągnij znacznik na mapie, aby poprawić lokalizację. Puste pola nie są pokazywane użytkownikom.</small></p></aside></div>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);let D=[],cur=null,pw=sessionStorage.pw||"",mk={},map,dirty=false;
const api=b=>fetch("/api/data",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw,...b})});
const F=["name","type","stage","lat","lng","coordStatus","cost","signed","dur","unit"];
const mark=d=>{dirty=d;$("msg").textContent=d?"Niezapisane zmiany":""};
$("go").onclick=async()=>{pw=$("pw").value;const r=await api({});if(r.ok){sessionStorage.pw=pw;start()}else $("err").textContent="Błędne hasło lub brak ustawionej zmiennej ADMIN_PASSWORD."};
if(pw)api({}).then(r=>r.ok&&start());
async function start(){$("login").style.display="none";$("app").classList.add("on");map=mapInit("map");D=await load();draw();
 if(D.length)map.fitBounds(L.latLngBounds(D.map(i=>[i.lat,i.lng])).pad(.1))}
function draw(){Object.values(mk).forEach(m=>m.remove());mk={};
 D.forEach(i=>{const on=cur&&cur.id===i.id,m=L.marker([i.lat,i.lng],{draggable:true,zIndexOffset:on?1000:0,icon:mIcon("budowa",i.coordStatus==="zatwierdzona"?"#2e9e4f":"#f59e0b",on)}).addTo(map).bindTooltip(i.name);
  m.on("click",()=>pick(i.id));
  m.on("dragend",e=>{const p=e.target.getLatLng();i.lat=+p.lat.toFixed(6);i.lng=+p.lng.toFixed(6);i.coordStatus="zatwierdzona";mark(true);pick(i.id)});mk[i.id]=m});
 $("ls").innerHTML=D.map(i=>`<li data-id="${i.id}" class="${cur&&cur.id===i.id?"h":""}">${i.name}<br><small class="${i.coordStatus==="zatwierdzona"?"ok":""}">${T[i.type].n.slice(0,-1)} · ${i.coordStatus}</small></li>`).join("")}
function pick(id){cur=D.find(i=>i.id===id);fill();draw();const l=document.querySelector(`li[data-id="${id}"]`);l&&l.scrollIntoView({block:"nearest"})}
function fill(){$("f").hidden=!cur;if(!cur)return;
 $("stage").innerHTML=T[cur.type].s.map((s,k)=>`<option value="${k+1}">${k+1}. ${s}</option>`).join("");
 F.forEach(k=>$(k).value=cur[k]??"")}
$("ls").onclick=e=>{const l=e.target.closest("li");if(l){pick(l.dataset.id);map.setView([cur.lat,cur.lng],Math.max(map.getZoom(),16))}};
F.forEach(k=>$(k).onchange=()=>{if(!cur)return;let v=$(k).value;
 if(["stage","lat","lng"].includes(k))v=+v;if(["cost","dur"].includes(k))v=v===""?null:+v;if(k==="signed")v=v||null;
 cur[k]=v;if(k==="type")cur.stage=1;if(k==="lat"||k==="lng")cur.coordStatus="zatwierdzona";mark(true);fill();draw()});
$("add").onclick=()=>{const c=map.getCenter(),i={id:"n"+Date.now(),name:"Nowa inwestycja",type:"projekt",stage:1,lat:+c.lat.toFixed(6),lng:+c.lng.toFixed(6),coordStatus:"przybliżona",cost:null,signed:null,dur:null,unit:"miesięcy"};
 D.push(i);mark(true);pick(i.id)};
$("del").onclick=()=>{if(cur&&confirm("Usunąć: "+cur.name+"?")){D=D.filter(i=>i!==cur);cur=null;mark(true);fill();draw()}};
$("save").onclick=async()=>{$("msg").textContent="Zapisywanie…";const r=await api({items:D});
 if(r.ok)mark(false),$("msg").textContent="Zapisano";else $("msg").innerHTML='<span class="e">Błąd zapisu</span>'};
addEventListener("beforeunload",e=>{if(dirty)e.preventDefault()});
</script></body></html>
