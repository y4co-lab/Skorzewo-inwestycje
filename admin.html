<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Panel administratora</title><link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;color:#1d2733}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#fff;color:#1d2733;border-bottom:4px solid;border-image:linear-gradient(90deg,#0b6fc2,#e32b2b,#f2b705,#2e8b3d) 1}.lg{height:50px;width:auto;display:block}@media(max-width:800px){.lg{height:40px}}h1{font-size:17px;margin:0;flex:1}
button{font:inherit;padding:6px 12px;border:1px solid #b9c3cf;border-radius:6px;background:#fff;cursor:pointer}button.p{background:#2e9e4f;color:#fff;border-color:#2e9e4f}
#login{margin:20vh auto;display:flex;flex-direction:column;gap:8px;width:min(300px,90vw)}
#app{display:none;flex:1;grid-template-columns:1fr 360px;min-height:0}#app.on{display:grid}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:40% 60%}}
#map{min-height:0}aside{overflow:auto;padding:10px;border-left:1px solid #d5dbe2}
input,select{width:100%;padding:6px;border:1px solid #b9c3cf;border-radius:6px;font:inherit}label{display:block;margin:6px 0;font-size:13px}
.r{display:flex;gap:8px}ul{list-style:none;margin:0 0 10px;padding:0;max-height:170px;overflow:auto;border:1px solid #d5dbe2;border-radius:6px}
li{padding:5px 8px;border-bottom:1px solid #e7ebf0;cursor:pointer;font-size:13px}li.h{background:#eef4fb;font-weight:600}li small{color:#b26a00}li small.ok{color:#2e9e4f}
.m{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #000a;margin:2px}.m.on{width:24px;height:24px;margin:-1px;border-color:#1f3a5f}
#msg{font-size:13px}.e{color:#d33}
</style></head><body>
<header><img class="lg" src="logo.jpg" alt="Skórzewo 360"><h1>Panel administratora</h1><span id="msg"></span><button id="lock">🔒 Pozycje zablokowane</button><button id="exp">Eksport (Excel)</button><button id="imp">Import: uzupełnij</button><button id="imp2">Import: zastąp</button><input id="file" type="file" accept=".xlsx,.xls" hidden><button id="add">Nowa inwestycja</button><button id="save" class="p">Zapisz zmiany</button></header>
<div id="login"><b>Hasło administratora</b><input id="pw" type="password"><button id="go" class="p">Zaloguj</button><span id="err" class="e"></span></div>
<div id="app"><div id="map"></div><aside><ul id="ls"></ul><div id="f" hidden>
<label>Nazwa<input id="name"></label>
<label>Typ<select id="type"><option value="budowa">Budowa</option><option value="projekt">Projekt</option></select></label>
<label>Etap<select id="stage"></select></label>
<label>Status<select id="status"><option value="">Brak</option><option value="unieważnione">Postępowanie unieważnione</option><option value="wstrzymane">Wstrzymane</option></select></label>
<div class="r"><label>Szerokość<input id="lat" type="number" step="any"></label><label>Długość<input id="lng" type="number" step="any"></label></div>
<label>Status lokalizacji<select id="coordStatus"><option>przybliżona</option><option>zatwierdzona</option></select></label>
<label>Koszt zadania (zł)<input id="cost" type="number" min="0"></label>
<label>Data podpisania umowy<input id="signed" type="date"></label>
<div class="r"><label>Czas trwania umowy<input id="dur" type="number" min="0"></label><label>Jednostka<select id="unit"><option>dni</option><option>miesięcy</option></select></label></div>
<button id="del">Usuń inwestycję</button></div><p><small>Aby przesunąć punkt, odblokuj pozycje przyciskiem u góry, a potem przeciągnij znacznik. Puste pola nie są pokazywane użytkownikom.</small></p></aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);let D=[],cur=null,pw=sessionStorage.pw||"",mk={},map,dirty=false;
let lock=true;const api=b=>fetch("/api/data",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw,...b})});
const F=["name","type","stage","lat","lng","coordStatus","cost","signed","dur","unit","status"];
const mark=d=>{dirty=d;$("msg").textContent=d?"Niezapisane zmiany":""};
$("go").onclick=async()=>{pw=$("pw").value;const r=await api({});if(r.ok){sessionStorage.pw=pw;start()}else $("err").textContent="Błędne hasło lub brak ustawionej zmiennej ADMIN_PASSWORD."};
if(pw)api({}).then(r=>r.ok&&start());
async function start(){$("login").style.display="none";$("app").classList.add("on");map=mapInit("map");D=await load();draw();
 if(D.length)map.fitBounds(L.latLngBounds(D.map(i=>[i.lat,i.lng])).pad(.1))}
function draw(){Object.values(mk).forEach(m=>m.remove());mk={};
 D.forEach(i=>{const on=cur&&cur.id===i.id,m=L.marker([i.lat,i.lng],{draggable:!lock,zIndexOffset:on?1000:0,icon:mIcon("budowa",i.coordStatus==="zatwierdzona"?"#2e9e4f":"#f59e0b",on,i.status)}).addTo(map).bindTooltip(i.name);
  m.on("click",()=>pick(i.id));
  m.on("dragend",e=>{const p=e.target.getLatLng();i.lat=+p.lat.toFixed(6);i.lng=+p.lng.toFixed(6);i.coordStatus="zatwierdzona";mark(true);pick(i.id)});mk[i.id]=m});
 $("ls").innerHTML=D.map(i=>`<li data-id="${i.id}" class="${cur&&cur.id===i.id?"h":""}">${i.name}<br><small class="${i.coordStatus==="zatwierdzona"?"ok":""}">${T[i.type].o} · ${i.coordStatus}${ST[i.status]?" · "+ST[i.status].n:""}</small></li>`).join("")}
function pick(id){cur=D.find(i=>i.id===id);fill();draw();const l=document.querySelector(`li[data-id="${id}"]`);l&&l.scrollIntoView({block:"nearest"})}
function fill(){$("f").hidden=!cur;if(!cur)return;
 $("stage").innerHTML=T[cur.type].s.map((s,k)=>`<option value="${k+1}">${k+1}. ${s}</option>`).join("");
 F.forEach(k=>$(k).value=cur[k]??"")}
$("ls").onclick=e=>{const l=e.target.closest("li");if(l){pick(l.dataset.id);map.setView([cur.lat,cur.lng],Math.max(map.getZoom(),16))}};
F.forEach(k=>$(k).onchange=()=>{if(!cur)return;let v=$(k).value;
 if(["stage","lat","lng"].includes(k))v=+v;if(["cost","dur"].includes(k))v=v===""?null:+v;if(k==="signed"||k==="status")v=v||null;
 cur[k]=v;if(k==="type")cur.stage=1;if(k==="lat"||k==="lng")cur.coordStatus="zatwierdzona";mark(true);fill();draw()});
$("add").onclick=()=>{const c=map.getCenter(),i={id:"n"+Date.now(),name:"Nowa inwestycja",type:"projekt",stage:1,lat:+c.lat.toFixed(6),lng:+c.lng.toFixed(6),coordStatus:"przybliżona",cost:null,signed:null,dur:null,unit:"miesięcy"};
 D.push(i);mark(true);pick(i.id)};
$("del").onclick=()=>{if(cur&&confirm("Usunąć: "+cur.name+"?")){D=D.filter(i=>i!==cur);cur=null;mark(true);fill();draw()}};
$("save").onclick=async()=>{$("msg").textContent="Zapisywanie…";const r=await api({items:D});
 if(r.ok)mark(false),$("msg").textContent="Zapisano";else $("msg").innerHTML='<span class="e">Błąd zapisu</span>'};

const g=(r,p)=>{const k=Object.keys(r).find(k=>k.startsWith(p));return k?r[k]:""};
const num=v=>{if(typeof v==="number")return v;const n=parseFloat(String(v).replace(/\s|zł|PLN/gi,"").replace(",","."));return isNaN(n)?null:n};
const p2=x=>String(x).padStart(2,"0");
const dat=v=>{if(v instanceof Date&&!isNaN(v)){const x=new Date(v.getTime()+432e5);return x.getFullYear()+"-"+p2(x.getMonth()+1)+"-"+p2(x.getDate())}
 const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
 m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);return m?m[3]+"-"+p2(m[2])+"-"+p2(m[1]):null};
const unitN=v=>{const s=String(v).trim().toLowerCase();return s.startsWith("d")?"dni":s.startsWith("m")?"miesięcy":null};
const statN=v=>{const s=String(v).trim().toLowerCase();if(!s)return undefined;if(s.startsWith("uniew"))return"unieważnione";if(s.startsWith("wstrz"))return"wstrzymane";return s==="brak"?null:undefined};
$("exp").onclick=()=>{const H=["ID","Typ","Nazwa inwestycji","Obecny etap","Koszt zadania (zł)","Data podpisania umowy","Czas trwania umowy","Jednostka (dni / miesięcy)","Status (brak / unieważnione / wstrzymane)"];
 const A=[H,...D.map(i=>[i.id,T[i.type].o,i.name,T[i.type].s[i.stage-1],i.cost??"",i.signed??"",i.dur??"",i.dur?i.unit:"",i.status||""])];
 const ws=XLSX.utils.aoa_to_sheet(A);ws["!cols"]=[8,10,58,24,18,20,16,18,26].map(w=>({wch:w}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Inwestycje");XLSX.writeFile(wb,"inwestycje-skorzewo.xlsx")};
let mode=false;$("imp").onclick=()=>{mode=false;$("file").click()};$("imp2").onclick=()=>{mode=true;$("file").click()};
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets["Inwestycje"]||wb.Sheets[wb.SheetNames[0]],{defval:""});
  if(mode&&!confirm("Tryb „zastąp”: puste komórki w pliku USUNĄ koszt, datę i czas trwania z inwestycji (status i etap bez zmian). Kontynuować?"))return;
  let n=0;const miss=[];
  rows.forEach(r=>{const id=String(g(r,"ID")).trim();if(!id)return;const i=D.find(x=>x.id===id);if(!i){miss.push(id);return}
   let ch=false;const set=(k,v)=>{if(v===null){if(mode&&["cost","signed","dur"].includes(k)&&i[k]!=null){i[k]=null;ch=true}}else if(i[k]!==v){i[k]=v;ch=true}};
   set("cost",num(g(r,"Koszt")));set("signed",dat(g(r,"Data")));set("dur",num(g(r,"Czas")));set("unit",unitN(g(r,"Jednostka")));
   const s=statN(g(r,"Status"));if(s!==undefined&&(i.status||null)!==s){i.status=s;ch=true}
   if(ch)n++});
  if(n)mark(true);if(cur)fill();draw();
  alert("Zaktualizowano inwestycji: "+n+"."+(miss.length?"\nNie znaleziono ID: "+miss.join(", "):"")+(n?"\nSprawdź dane i kliknij „Zapisz zmiany”, aby je zatwierdzić.":""))}
 catch(err){alert("Nie udało się wczytać pliku. Użyj pliku .xlsx z szablonu lub z eksportu.")}};
$("lock").onclick=()=>{lock=!lock;$("lock").textContent=lock?"🔒 Pozycje zablokowane":"🔓 Pozycje odblokowane";$("lock").style.background=lock?"":"#ffe0b2";Object.values(mk).forEach(m=>lock?m.dragging.disable():m.dragging.enable())};
addEventListener("beforeunload",e=>{if(dirty)e.preventDefault()});
</script></body></html>
